const list=document.getElementById('list'), search=document.getElementById('search'), jump=document.getElementById('jump');
const currentNo=document.getElementById('currentNo');
const STORAGE_KEY='ai-trainer-level3-last-question';
let cards=[];
function escapeHtml(v) { return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function render() {
  const fragment=document.createDocumentFragment();
  QUESTIONS.forEach(q => {
    const card=document.createElement('article');
    card.tabIndex=-1; card.dataset.no=q.no;
    const answerText=escapeHtml(q.answer+' · '+q.options['ABCD'.indexOf(q.answer)]);
    card.innerHTML=`<div class="qhead"><span class="no">${q.no}</span><span class="qtype">单选</span></div>
      <p>${escapeHtml(q.question)}</p>
      <ol>${q.options.map((v,i)=>`<li><input type="radio" name="q-${q.no}" value="${'ABCD'[i]}" aria-label="第${q.no}题选项${'ABCD'[i]}"><span class="option-label">${'ABCD'[i]}</span><span class="option-text">${escapeHtml(v)}</span></li>`).join('')}</ol>
      <details class="answer"><summary>查看答案</summary><div class="answer-body"><span class="answer-label">答案</span><span>${answerText}</span></div></details>`;
    fragment.appendChild(card);
  });
  list.replaceChildren(fragment);
  cards=[...list.children];
}
function visibleCards() { return cards.filter(c=>c.style.display!=='none'); }
function filter() {
  const term=search.value.trim().toLowerCase(); let first=null;
  cards.forEach(card => {
    const q=QUESTIONS[Number(card.dataset.no)-1];
    const hit=!term || String(q.no)===term || (q.question+' '+q.options.join(' ')).toLowerCase().includes(term);
    card.style.display=hit?'':'none';
    if(hit && !first) first=card;
  });
  if(!visibleCards().length) list.insertAdjacentHTML('beforeend','<div class="empty">没有匹配的题目</div>');
  if(first) setCurrent(Number(first.dataset.no),false);
}
function setCurrent(no,scroll=true) {
  currentNo.textContent=no; jump.value=no; localStorage.setItem(STORAGE_KEY,String(no));
  if(scroll) {
    const card=cards.find(c=>Number(c.dataset.no)===no);
    if(card) card.scrollIntoView({block:'start'});
  }
}
function move(delta) {
  const visible=visibleCards(); if(!visible.length) return;
  const now=Number(currentNo.textContent);
  let index=visible.findIndex(c=>Number(c.dataset.no)===now);
  index=index<0?0:Math.min(Math.max(index+delta,0),visible.length-1);
  setCurrent(Number(visible[index].dataset.no));
}
document.getElementById('controls').addEventListener('submit',e=>e.preventDefault());
search.addEventListener('input',filter);
document.getElementById('prev').addEventListener('click',()=>move(-1));
document.getElementById('next').addEventListener('click',()=>move(1));
jump.addEventListener('change',()=>{
  const no=Math.min(Math.max(Number(jump.value)||1,1),300); setCurrent(no);
});
const observer=new IntersectionObserver(entries=>{
  for(const entry of entries) if(entry.isIntersecting) {
    currentNo.textContent=entry.target.dataset.no; jump.value=entry.target.dataset.no;
    localStorage.setItem(STORAGE_KEY,entry.target.dataset.no);
  }
},{rootMargin:'0px 0px -68% 0px',threshold:0});
render(); cards.forEach(card=>observer.observe(card));
const saved=Number(localStorage.getItem(STORAGE_KEY)||1); setCurrent(Math.min(Math.max(saved,1),300),true);
</script>
